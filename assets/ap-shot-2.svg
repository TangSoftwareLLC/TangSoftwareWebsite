<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 540" role="img" aria-label="Apartment 520 screenshot: clue inspection">
  <defs>
    <linearGradient id="a2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3340"/>
      <stop offset="100%" stop-color="#1c2028"/>
    </linearGradient>
  </defs>
  <rect width="270" height="540" fill="url(#a2-bg)"/>
  <text x="20" y="44" font-family="'Space Mono',monospace" font-size="11" fill="#7fd1c4" letter-spacing="3">EVIDENCE · 03</text>
  <text x="20" y="78" font-family="'Fraunces',Georgia,serif" font-size="24" font-weight="700" fill="#fffdf7">The Letter</text>
  <!-- magnified letter -->
  <g transform="rotate(-4 135 250)">
    <rect x="55" y="120" width="160" height="220" rx="6" fill="#f1e7d2" stroke="#221c15" stroke-width="3"/>
    <line x1="74" y1="160" x2="196" y2="160" stroke="#8a8070" stroke-width="2.5"/>
    <line x1="74" y1="182" x2="196" y2="182" stroke="#b6a98c" stroke-width="2"/>
    <line x1="74" y1="200" x2="180" y2="200" stroke="#b6a98c" stroke-width="2"/>
    <line x1="74" y1="218" x2="196" y2="218" stroke="#b6a98c" stroke-width="2"/>
    <line x1="74" y1="236" x2="150" y2="236" stroke="#b6a98c" stroke-width="2"/>
    <!-- circled clue -->
    <ellipse cx="150" cy="200" rx="44" ry="18" fill="none" stroke="#c75d3f" stroke-width="3"/>
    <text x="150" y="300" text-anchor="middle" font-family="'Fraunces',Georgia,serif" font-size="18" font-style="italic" fill="#574e41">— don't tell 520</text>
  </g>
  <!-- magnifier -->
  <circle cx="200" cy="300" r="34" fill="#7fd1c4" fill-opacity="0.18" stroke="#7fd1c4" stroke-width="4"/>
  <line x1="224" y1="324" x2="246" y2="346" stroke="#7fd1c4" stroke-width="7" stroke-linecap="round"/>
  <!-- action chips -->
  <rect x="20" y="430" width="110" height="44" rx="22" fill="#2c6e63" stroke="#fffdf7" stroke-width="2.5"/>
  <text x="75" y="458" text-anchor="middle" font-family="'Hanken Grotesk',sans-serif" font-size="13" font-weight="700" fill="#fff">Examine</text>
  <rect x="140" y="430" width="110" height="44" rx="22" fill="#221c15" stroke="#fffdf7" stroke-width="2.5"/>
  <text x="195" y="458" text-anchor="middle" font-family="'Hanken Grotesk',sans-serif" font-size="13" font-weight="700" fill="#fff">Add to case</text>
  <text x="135" y="506" text-anchor="middle" font-family="'Space Mono',monospace" font-size="11" fill="#8a98a0" letter-spacing="2">5 OF 9 CLUES FOUND</text>
</svg>
