  <text x="20" y="56" font-family="'Fraunces',Georgia,serif" font-size="26" font-weight="700" fill="#fff">12,480</text>
  <circle cx="232" cy="38" r="18" fill="#edc24c" stroke="#fff" stroke-width="2"/>
  <text x="232" y="44" text-anchor="middle" font-family="'Fraunces',Georgia,serif" font-size="18" font-weight="700" fill="#1f5048">7</text>
  <!-- merge field bubbles -->
  <circle cx="70" cy="180" r="34" fill="url(#s1-y)" stroke="#221c15" stroke-width="3"/>
  <circle cx="150" cy="150" r="44" fill="url(#s1-c)" stroke="#221c15" stroke-width="3"/>
  <circle cx="218" cy="200" r="28" fill="url(#s1-t)" stroke="#221c15" stroke-width="3"/>
  <circle cx="95" cy="270" r="40" fill="url(#s1-p)" stroke="#221c15" stroke-width="3"/>
  <circle cx="185" cy="285" r="30" fill="url(#s1-y)" stroke="#221c15" stroke-width="3"/>
  <circle cx="60" cy="350" r="26" fill="url(#s1-t)" stroke="#221c15" stroke-width="3"/>
  <circle cx="140" cy="365" r="36" fill="url(#s1-c)" stroke="#221c15" stroke-width="3"/>
  <circle cx="215" cy="345" r="22" fill="url(#s1-p)" stroke="#221c15" stroke-width="3"/>
  <!-- merge spark -->
  <path d="M150 150 l5 -14 4 12 13 3 -12 5 -3 13 -5 -12 -13 -3z" fill="#fffdf7" stroke="#221c15" stroke-width="2"/>
  <!-- launcher -->
  <rect x="0" y="452" width="270" height="88" fill="#1f5048"/>
  <circle cx="135" cy="496" r="30" fill="url(#s1-p)" stroke="#fff" stroke-width="3"/>
  <text x="135" y="528" text-anchor="middle" font-family="'Space Mono',monospace" font-size="10" fill="#bfe6e0" letter-spacing="3">TAP TO MERGE</text>
