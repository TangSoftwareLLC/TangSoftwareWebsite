<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 540" role="img" aria-label="BubbleMerge gameplay screenshot: the board">
  <defs>
    <linearGradient id="s1-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe6e0"/>
      <stop offset="100%" stop-color="#7fd1c4"/>
    </linearGradient>
    <radialGradient id="s1-y" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#fff"/><stop offset="55%" stop-color="#edc24c"/><stop offset="100%" stop-color="#d49a2e"/></radialGradient>
    <radialGradient id="s1-c" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#fff"/><stop offset="55%" stop-color="#e88a6f"/><stop offset="100%" stop-color="#c75d3f"/></radialGradient>
    <radialGradient id="s1-t" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#fff"/><stop offset="55%" stop-color="#54b0a3"/><stop offset="100%" stop-color="#2c6e63"/></radialGradient>
    <radialGradient id="s1-p" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#fff"/><stop offset="55%" stop-color="#8d97da"/><stop offset="100%" stop-color="#6470cf"/></radialGradient>
  </defs>
  <rect width="270" height="540" fill="url(#s1-bg)"/>
  <!-- top HUD -->
  <rect x="0" y="0" width="270" height="74" fill="#1f5048"/>
