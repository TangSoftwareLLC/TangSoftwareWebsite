<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tang Software mark">
  <!-- Sticker-style rounded square with a 'T' carved from overlapping shapes -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#221c15"/>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="none" stroke="#221c15" stroke-width="2"/>
  <!-- warm inner panel -->
  <rect x="9" y="9" width="46" height="46" rx="11" fill="#f6f1e6"/>
  <!-- playful orbiting dot -->
  <circle cx="46" cy="18" r="5.5" fill="#c75d3f" stroke="#221c15" stroke-width="2"/>
  <!-- the 'T' -->
  <path d="M18 22 H40 a2 2 0 0 1 2 2 v2 a2 2 0 0 1 -2 2 H33 v14 a2 2 0 0 1 -2 2 h-2 a2 2 0 0 1 -2 -2 V28 h-7 a2 2 0 0 1 -2 -2 v-2 a2 2 0 0 1 2 -2 z" fill="#2c6e63"/>
  <!-- baseline tick for personality -->
  <rect x="24" y="46" width="10" height="3.5" rx="1.75" fill="#edc24c"/>
</svg>
