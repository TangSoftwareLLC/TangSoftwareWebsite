<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 540" role="img" aria-label="Apartment 520 screenshot: the front door">
  <defs>
    <linearGradient id="a1-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3550"/>
      <stop offset="100%" stop-color="#221c2e"/>
    </linearGradient>
    <radialGradient id="a1-lamp" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#edc24c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#edc24c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="270" height="540" fill="url(#a1-bg)"/>
  <rect x="55" y="40" width="160" height="160" fill="url(#a1-lamp)"/>
  <!-- corridor floor -->
  <path d="M0 420 L270 420 L270 540 L0 540 Z" fill="#2a2438"/>
  <path d="M40 540 L110 420 L160 420 L230 540 Z" fill="#332c44"/>
  <!-- door -->
  <rect x="78" y="150" width="114" height="270" rx="4" fill="#5b4a3a" stroke="#221c15" stroke-width="4"/>
  <rect x="90" y="166" width="40" height="110" rx="3" fill="#6b5746" stroke="#221c15" stroke-width="2.5"/>
  <rect x="140" y="166" width="40" height="110" rx="3" fill="#6b5746" stroke="#221c15" stroke-width="2.5"/>
  <rect x="90" y="290" width="40" height="110" rx="3" fill="#6b5746" stroke="#221c15" stroke-width="2.5"/>
  <rect x="140" y="290" width="40" height="110" rx="3" fill="#6b5746" stroke="#221c15" stroke-width="2.5"/>
  <circle cx="176" cy="288" r="5" fill="#edc24c"/>
  <!-- number plate 520 -->
  <rect x="106" y="120" width="58" height="26" rx="4" fill="#c75d3f" stroke="#221c15" stroke-width="3"/>
  <text x="135" y="139" text-anchor="middle" font-family="'Space Mono',monospace" font-size="16" font-weight="700" fill="#fffdf7" letter-spacing="3">520</text>
  <!-- dialog box -->
  <rect x="20" y="446" width="230" height="74" rx="12" fill="#f6f1e6" stroke="#221c15" stroke-width="3"/>
  <text x="34" y="472" font-family="'Space Mono',monospace" font-size="10" fill="#c75d3f" letter-spacing="1">YOU</text>
  <text x="34" y="494" font-family="'Hanken Grotesk',sans-serif" font-size="13" fill="#221c15">The key still fits. But the</text>
  <text x="34" y="510" font-family="'Hanken Grotesk',sans-serif" font-size="13" fill="#221c15">locks have all been changed…</text>
