<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" role="img" aria-label="Illustration: a games studio workbench with bubbles and a glowing window">
  <defs>
    <radialGradient id="h-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#edc24c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#edc24c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-b1" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#fff"/><stop offset="55%" stop-color="#edc24c"/><stop offset="100%" stop-color="#c75d3f"/></radialGradient>
    <radialGradient id="h-b2" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#fff"/><stop offset="55%" stop-color="#7fd1c4"/><stop offset="100%" stop-color="#2c6e63"/></radialGradient>
    <radialGradient id="h-b3" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#fff"/><stop offset="55%" stop-color="#8d97da"/><stop offset="100%" stop-color="#6470cf"/></radialGradient>
  </defs>
  <circle cx="260" cy="180" r="220" fill="url(#h-glow)"/>

  <!-- back card: apartment window -->
  <g transform="rotate(-5 150 180)">
    <rect x="60" y="70" width="180" height="220" rx="18" fill="#2a2438" stroke="#221c15" stroke-width="4"/>
    <rect x="84" y="96" width="132" height="150" rx="8" fill="#3a3550" stroke="#221c15" stroke-width="3"/>
    <line x1="150" y1="96" x2="150" y2="246" stroke="#221c15" stroke-width="3"/>
    <line x1="84" y1="171" x2="216" y2="171" stroke="#221c15" stroke-width="3"/>
    <rect x="92" y="104" width="50" height="59" fill="#edc24c" opacity="0.85"/>
    <circle cx="190" cy="135" r="12" fill="#edc24c"/>
    <rect x="100" y="262" width="100" height="16" rx="8" fill="#c75d3f" stroke="#221c15" stroke-width="2.5"/>
    <text x="150" y="275" text-anchor="middle" font-family="'Space Mono',monospace" font-size="11" font-weight="700" fill="#fffdf7" letter-spacing="2">520</text>
  </g>

  <!-- front card: bubble board -->
  <g transform="rotate(4 360 230)">
    <rect x="280" y="120" width="190" height="240" rx="20" fill="#f6f1e6" stroke="#221c15" stroke-width="4"/>
    <rect x="280" y="120" width="190" height="46" rx="20" fill="#2c6e63"/>
    <rect x="280" y="146" width="190" height="20" fill="#2c6e63"/>
    <text x="300" y="150" font-family="'Space Mono',monospace" font-size="11" fill="#bfe6e0" letter-spacing="2">SCORE 9,210</text>
    <circle cx="330" cy="220" r="30" fill="url(#h-b1)" stroke="#221c15" stroke-width="3"/>
    <circle cx="400" cy="205" r="38" fill="url(#h-b2)" stroke="#221c15" stroke-width="3"/>
    <circle cx="345" cy="290" r="34" fill="url(#h-b3)" stroke="#221c15" stroke-width="3"/>
    <circle cx="420" cy="295" r="26" fill="url(#h-b1)" stroke="#221c15" stroke-width="3"/>
    <path d="M400 205 l5 -13 4 11 12 3 -11 5 -3 12 -5 -11 -12 -3z" fill="#fffdf7" stroke="#221c15" stroke-width="2"/>
  </g>

  <!-- floating sparks -->
  <g stroke="#221c15" stroke-width="2">
    <path d="M250 40 l4 -12 4 12 12 4 -12 4 -4 12 -4 -12 -12 -4z" fill="#edc24c"/>
    <circle cx="40" cy="330" r="10" fill="#d98a86"/>
    <circle cx="490" cy="400" r="13" fill="#6470cf"/>
    <rect x="20" y="120" width="16" height="16" rx="4" fill="#2c6e63" transform="rotate(18 28 128)"/>
  </g>
</svg>
